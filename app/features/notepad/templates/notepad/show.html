{% extends "base_template.html" %}

{% block title %}View notepad{% endblock %}

{% block content %}
<h1 class="h2 mb-3"><b>View</b> notepad</h1>

<div class="row">
    <div class="col-12 col-lg-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ notepad.title }}</h5>
                <p class="card-text">{{ notepad.body }}</p>
                <a href="{{ url_for('notepad.edit_notepad', notepad_id=notepad.id) }}" class="btn btn-secondary">Edit</a>
                <a href="{{ url_for('notepad.index') }}" class="btn btn-outline-secondary">Back</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
