# ==============================================================================
# CASO 1: Despliegue solo si un PR ha sido APROBADO y MERGEADO (ACTIVO)
# ==============================================================================
name: Deploy to Render (Caso 1: PR Aprobado y Mergeado)

# Se dispara cuando un PR hacia 'main' se cierra
on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Render
    # Condicion 1: Solo se ejecuta si el PR termino en merge (no simplemente cerrado/cancelado)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      # Condicion 2: Comprueba con GitHub CLI que el PR tuvo review APPROVED formal
      - name: Verificar aprobacion formal del PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DECISION=$(gh pr view ${{ github.event.pull_request.number }} --json reviewDecision -q .reviewDecision)
          if [ "$DECISION" != "APPROVED" ]; then
            echo "El Pull Request no fue aprobado formalmente por un revisor. Abortando despliegue."
            exit 1
          fi

      # Si esta aprobado y mergeado, dispara el hook de Render
      - name: Trigger Render Deploy Hook
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl "$deploy_url"


