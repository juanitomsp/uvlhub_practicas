name: Code Linting & Style

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  linter:
    name: Lint Python Code
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      # Ruff analiza errores y estilo a gran velocidad
      - name: Run Ruff Linter
        run: |
          ruff check app/

      # Flake8 comprueba complejidad y sintaxis
      - name: Run Flake8
        run: |
          flake8 app/ --count --max-line-length=127 --statistics
